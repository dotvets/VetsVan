<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم VETS VAN</title>
<style>
  *{box-sizing:border-box}
  body{font-family:sans-serif;margin:0;display:flex;min-height:100vh;background:#f7f3fa}
  .side{width:220px;background:#a32890;color:#fff;padding:24px 0;flex-shrink:0}
  .side h2{padding:0 20px 20px;font-size:18px;margin:0}
  .side div{padding:12px 20px;cursor:pointer;font-size:15px}
  .side div.active,.side div:hover{background:rgba(255,255,255,.18)}
  .main{flex:1;padding:28px;overflow-y:auto}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:right;padding:10px;border-bottom:2px solid #eee;color:#a32890}
  td{padding:10px;border-bottom:1px solid #f0f0f0}
  .stat{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .stat b{display:block;font-size:30px;color:#a32890}
  button,.btn{background:#a32890;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
  input,select,textarea{padding:9px;border-radius:8px;border:1px solid #ddd;font-size:14px;margin-bottom:8px;width:100%}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px}
  .paid{background:#e8f8ee;color:#1a7f37}.pending{background:#fff8e1;color:#b58900}.unpaid{background:#f1f1f1;color:#777}.failed{background:#fdecec;color:#c00}
</style>
</head>
<body>
<div class="side">
  <h2>🚐 VETS VAN</h2>
  <div data-t="dash" class="active">الرئيسية</div>
  <div data-t="bookings">الحجوزات</div>
  <div data-t="payments">المدفوعات</div>
  <div data-t="services">الخدمات والأسعار</div>
  <div data-t="messages">الرسائل</div>
  <div data-t="reviews">التقييمات</div>
  <div data-t="content">محتوى الموقع</div>
  <div data-t="settings">الإعدادات</div>
  <div id="logout" style="margin-top:40px">تسجيل خروج</div>
</div>
<div class="main" id="main"></div>
<script>
const token = localStorage.getItem('vv_token');
if (!token) location.href = '/admin/login';
const api = async (u, o = {}) => {
  const r = await fetch(u, { ...o, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(o.headers||{}) } });
  if (r.status === 401) { localStorage.removeItem('vv_token'); location.href = '/admin/login'; }
  return r.status === 204 ? null : r.json();
};
const main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

async function show(t) {
  document.querySelectorAll('.side div[data-t]').forEach(d => d.classList.toggle('active', d.dataset.t === t));
  if (t === 'dash') {
    const d = await api('/api/dashboard');
    main.innerHTML = `<div class="grid">
      <div class="stat"><b>${d.stats.total}</b>إجمالي الحجوزات</div>
      <div class="stat"><b>${d.stats.pending}</b>قيد الانتظار</div>
      <div class="stat"><b>${d.stats.completed}</b>مكتملة</div>
      <div class="stat"><b>${d.stats.unreadMessages}</b>رسائل غير مقروءة</div></div>
      <div class="card"><h3>أحدث الحجوزات</h3>${bookingTable(d.recent)}</div>`;
  }
  if (t === 'bookings') {
    const rows = await api('/api/bookings');
    main.innerHTML = `<div class="card"><h3>الحجوزات (${rows.length})</h3>${bookingTable(rows, true)}</div>`;
    main.querySelectorAll('select[data-bid]').forEach(s => s.onchange = async () => {
      await api('/api/bookings/' + s.dataset.bid, { method: 'PATCH', body: JSON.stringify({ status: s.value }) });
    });
  }
  if (t === 'payments') {
    const filter = window._payFilter || '';
    const rows = await api('/api/admin/payments' + (filter ? '?status=' + filter : ''));
    const counts = {};
    (await api('/api/admin/payments')).forEach(r => counts[r.payment_status] = (counts[r.payment_status]||0)+1);
    const stBadge = s => ({pending:'🟡 Pending Payment',paid:'🟢 Paid',failed:'🔴 Failed',cancelled:'⚪ Cancelled',verification_required:'🟠 Verification Required',unpaid:'⚪ Unpaid'}[s]||s);
    main.innerHTML = `<div class="card"><h3>المدفوعات</h3>
      <div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap">
        ${['','pending','paid','failed','cancelled','verification_required'].map(f => `<button class="btn" style="${filter===f?'':'background:#ddd;color:#333'}" data-f="${f}">${f===''?'الكل':stBadge(f)}</button>`).join('')}
      </div>
      <table><tr><th>Order ID</th><th>العميل</th><th>الخدمة</th><th>سعر الخدمة</th><th>قيمة الفاتورة</th><th>Invoice ID</th><th>Payment Method</th><th>الحالة</th><th>التحقق</th><th>تاريخ العملية</th><th></th></tr>
      ${rows.map(p => `<tr>
        <td>${esc(p.booking_code)}</td><td>${esc(p.customer_name)}<br><small style="color:#999">${esc(p.mobile)}</small></td>
        <td>${esc(p.service_name_ar || p.service_name || '—')}</td><td>${p.service_price ?? '—'}</td><td>${p.invoice_amount ?? '—'} ريال</td>
        <td>${esc(p.invoice_id || '—')}</td><td>${esc(p.payment_method || '—')}</td>
        <td><span class="badge ${p.payment_status}">${stBadge(p.payment_status)}</span></td>
        <td>${p.verification_status === 'verified' ? '✅ موثق' : p.verification_status === 'failed' ? '❌' : '—'}</td>
        <td>${esc(p.transaction_date || (p.paid_at||'').slice(0,10) || '—')}</td>
        <td>${p.payment_id ? `<button class="btn" data-verify="${esc(p.booking_code)}">إعادة تحقق</button>` : ''}</td>
      </tr>`).join('')}</table></div>`;
    main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { window._payFilter = b.dataset.f || undefined; show('payments'); });
    main.querySelectorAll('[data-verify]').forEach(b => b.onclick = async () => {
      b.textContent = '…'; const r = await api('/api/admin/payments/' + b.dataset.verify + '/verify', { method: 'POST' });
      show('payments');
    });
  }
  if (t === 'services') {
    const rows = await api('/api/admin/services').catch(() => []);
    main.innerHTML = `<div class="card"><h3>Services → Pricing</h3>
      <p style="color:#888;font-size:13px">الأسعار هنا هي المصدر الوحيد — الموقع والفواتير يقرآن منها مباشرة. تعديل السعر لا يؤثر على الطلبات القديمة.</p>
      <table><tr><th>الاسم (EN)</th><th>الاسم (AR)</th><th>السعر (ريال)</th><th>فعّالة</th><th>آخر تعديل للسعر</th><th></th></tr>
      ${rows.map(svc => `<tr>
        <td><input value="${esc(svc.name_en)}" data-sid="${svc.id}" data-f="name_en"></td>
        <td><input value="${esc(svc.name_ar)}" data-sid="${svc.id}" data-f="name_ar"></td>
        <td><input type="number" min="0" step="0.01" value="${svc.price ?? ''}" data-sid="${svc.id}" data-f="price" style="width:110px"></td>
        <td><input type="checkbox" ${svc.active ? 'checked' : ''} data-sid="${svc.id}" data-f="active" style="width:auto"></td>
        <td style="font-size:12px;color:#999">${svc.price_updated_at ? esc(String(svc.price_updated_at).slice(0,16).replace('T',' ')) : '—'}</td>
        <td><button class="btn" data-save="${svc.id}">حفظ</button></td>
      </tr>`).join('')}</table>
      <h4 style="margin-top:20px">إضافة خدمة جديدة</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr 130px;gap:8px">
        <input id="ns_en" placeholder="Name (EN)"><input id="ns_ar" placeholder="الاسم (AR)"><input id="ns_price" type="number" min="0" placeholder="السعر">
      </div>
      <button class="btn" id="ns_add">إضافة</button></div>`;
    main.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
      const id = b.dataset.save;
      const body = {};
      main.querySelectorAll(`[data-sid="${id}"]`).forEach(i => {
        body[i.dataset.f] = i.type === 'checkbox' ? i.checked : (i.type === 'number' ? (i.value === '' ? null : Number(i.value)) : i.value);
      });
      b.textContent = '…';
      await api('/api/admin/services/' + id, { method: 'PATCH', body: JSON.stringify(body) });
      show('services');
    });
    document.getElementById('ns_add').onclick = async () => {
      const en = document.getElementById('ns_en').value; if (!en) return;
      await api('/api/admin/services', { method: 'POST', body: JSON.stringify({ name_en: en, name_ar: document.getElementById('ns_ar').value, price: document.getElementById('ns_price').value || null }) });
      show('services');
    };
  }
  if (t === 'messages') {
    const rows = await api('/api/admin/messages');
    main.innerHTML = `<div class="card"><h3>الرسائل (${rows.length})</h3>
      ${rows.map(m => `<div class="card" style="background:${m.status==='unread'?'#fdf3fb':'#fafafa'}"><b>${esc(m.name)}</b> — ${esc(m.mobile||'')} ${esc(m.email||'')}<br>${esc(m.message)}<br><small style="color:#999">${esc((m.created_at||'').slice(0,16))}</small></div>`).join('') || '<p>لا رسائل.</p>'}</div>`;
  }
  if (t === 'reviews') {
    const rows = await api('/api/admin/reviews');
    const avg = rows.length ? (rows.reduce((a, r) => a + r.rating, 0) / rows.length).toFixed(1) : '—';
    main.innerHTML = `<div class="card"><h3>التقييمات (${rows.length}) — المتوسط: ${avg} ⭐</h3>
      <table><tr><th>الحجز</th><th>العميل</th><th>الخدمة</th><th>التقييم</th><th>التعليق</th><th>التاريخ</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.booking_code)}</td><td>${esc(r.customer_name||'—')}</td><td>${esc(r.service_name_ar||r.service_name||'—')}</td>
        <td style="color:#f5b301;font-size:18px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td><td>${esc(r.comment||'—')}</td><td>${esc((r.created_at||'').slice(0,10))}</td></tr>`).join('') || '<tr><td colspan="6">لا تقييمات بعد.</td></tr>'}</table></div>`;
  }
  if (t === 'content') {
    const rows = await api('/api/content');
    main.innerHTML = `<div class="card"><h3>محتوى الموقع</h3>
      ${Object.entries(rows).map(([k, v]) => `<div style="border-bottom:1px solid #eee;padding:10px 0"><code style="color:#a32890">${esc(k)}</code>
      <input value="${esc(v.en)}" placeholder="English" data-k="${esc(k)}" data-l="en">
      <input value="${esc(v.ar)}" placeholder="العربية" data-k="${esc(k)}" data-l="ar"></div>`).join('') || '<p>لا محتوى بعد.</p>'}
      <h4>إضافة/تعديل مفتاح</h4><input id="ck" placeholder="المفتاح"><input id="cen" placeholder="English"><input id="car" placeholder="العربية">
      <button id="csave">حفظ</button></div>`;
    main.querySelectorAll('input[data-k]').forEach(i => i.onblur = async () => {
      const cur = (await api('/api/content'))[i.dataset.k] || {};
      await api('/api/admin/content/' + encodeURIComponent(i.dataset.k), { method: 'PUT', body: JSON.stringify({ en: i.dataset.l === 'en' ? i.value : cur.en, ar: i.dataset.l === 'ar' ? i.value : cur.ar }) });
    });
    document.getElementById('csave').onclick = async () => {
      const k = document.getElementById('ck').value; if (!k) return;
      await api('/api/admin/content/' + encodeURIComponent(k), { method: 'PUT', body: JSON.stringify({ en: document.getElementById('cen').value, ar: document.getElementById('car').value }) });
      show('content');
    };
  }
  if (t === 'settings') {
    const rows = await api('/api/admin/settings').catch(() => ({}));
    main.innerHTML = `<div class="card"><h3>الإعدادات</h3>
      ${Object.entries(rows||{}).map(([k,v]) => `<div style="margin-bottom:8px"><code>${esc(k)}</code><input value="${esc(v)}" data-sk="${esc(k)}"></div>`).join('') || '<p>لا إعدادات.</p>'}
      <h4>إضافة إعداد</h4><input id="sk" placeholder="المفتاح"><input id="sv" placeholder="القيمة"><button id="ssave">حفظ</button></div>`;
    main.querySelectorAll('input[data-sk]').forEach(i => i.onblur = () => api('/api/admin/settings/' + encodeURIComponent(i.dataset.sk), { method: 'PUT', body: JSON.stringify({ value: i.value }) }));
    document.getElementById('ssave').onclick = async () => {
      const k = document.getElementById('sk').value; if (!k) return;
      await api('/api/admin/settings/' + encodeURIComponent(k), { method: 'PUT', body: JSON.stringify({ value: document.getElementById('sv').value }) });
      show('settings');
    };
  }
}
function waAdminLink(b, num) {
  const L = ['🔔 حجز — VetsVan', '------------------------------',
    'رقم الحجز: ' + b.booking_code, 'صاحب الحجز: ' + (b.customer_name||''), 'الجوال: ' + (b.mobile||'')];
  if (b.email) L.push('البريد: ' + b.email);
  if (b.pet_type) L.push('نوع الحيوان: ' + b.pet_type);
  if (b.pet_name) L.push('اسم الحيوان: ' + b.pet_name);
  if (b.service_name) L.push('الخدمة: ' + b.service_name + (b.service_price != null ? ' — ' + b.service_price + ' ريال' : ''));
  if (b.area) L.push('الحي/المنطقة: ' + b.area);
  if (b.address) L.push('العنوان: ' + b.address);
  if (b.appointment_date) L.push('تاريخ الحجز: ' + String(b.appointment_date).slice(0,10));
  if (b.appointment_time) L.push('الوقت: ' + b.appointment_time);
  L.push('حالة الدفع: ' + (b.payment_status || 'unpaid'));
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(L.join('\n'));
}
function waReviewLink(b) {
  let m = String(b.mobile||'').replace(/\D/g,'').replace(/^0/,'966');
  if (!m.startsWith('966')) m = '966' + m;
  const txt = encodeURIComponent(`عزيزنا ${b.customer_name}، شكرًا لثقتك بـ VetsVan 💜 يسعدنا تقييمك للخدمة (حجز ${b.booking_code}): ${location.origin}/review.html?code=${b.booking_code}`);
  return `https://wa.me/${m}?text=${txt}`;
}
function bookingTable(rows, editable) {
  if (!rows || !rows.length) return '<p>لا حجوزات.</p>';
  return `<table><tr><th>الكود</th><th>العميل</th><th>الجوال</th><th>الخدمة</th><th>التاريخ</th><th>الدفع</th><th>الحالة</th><th>تقييم</th></tr>
    ${rows.map(b => `<tr><td>${esc(b.booking_code)}</td><td>${esc(b.customer_name)}</td><td>${esc(b.mobile)}</td><td>${esc(b.service_name||'—')}</td>
    <td>${esc(b.appointment_date ? String(b.appointment_date).slice(0,10) : '—')}</td>
    <td><span class="badge ${b.payment_status||'unpaid'}">${b.payment_status||'unpaid'}</span></td>
    <td>${editable ? `<select data-bid="${b.id}">${['new','pending','confirmed','completed','cancelled'].map(s => `<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select>` : esc(b.status)}</td>
    <td>${b.status==='completed' ? `<a class="btn" style="background:#25d366;text-decoration:none" target="_blank" href="${waReviewLink(b)}">إرسال طلب تقييم 💬</a>` : ''}
      <a class="btn" style="background:#25d366;text-decoration:none;margin-top:4px" target="_blank" href="${waAdminLink(b,'966920011626')}">واتساب 920011626 💬</a>
      <a class="btn" style="background:#1faa53;text-decoration:none;margin-top:4px" target="_blank" href="${waAdminLink(b,'966539760530')}">واتساب 0539760530 💬</a></td></tr>`).join('')}</table>`;
}
document.querySelectorAll('.side div[data-t]').forEach(d => d.onclick = () => show(d.dataset.t));
document.getElementById('logout').onclick = () => { localStorage.removeItem('vv_token'); location.href = '/admin/login'; };
show('dash');
</script>
</body>
</html>
