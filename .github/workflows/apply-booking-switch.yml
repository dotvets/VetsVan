name: Apply booking source switch

on:
  push:
    branches:
      - chatgpt/booking-source-switch
    paths:
      - .github/workflows/apply-booking-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/booking-source-switch
          fetch-depth: 0

      - name: Patch VETS VAN booking source integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Expose only the safe public booking configuration.
          server = Path('server/index.js')
          text = server.read_text(encoding='utf-8')
          health = "app.get('/api/health',(_req,res)=>res.json({ok:true,database:!!pool}));"
          route = r'''
// Public booking UI configuration. Only non-sensitive values are exposed.
app.get('/api/booking-config', async (_req, res) => {
  const fallback = { source: 'internal', digitail_clinic_slug: 'vetsvan-01-5519deb-ryd' };
  res.set('Cache-Control', 'no-store');
  if (!pool) return res.json(fallback);
  try {
    const rows = (await query("SELECT key,value FROM site_settings WHERE key IN ('booking_source','digitail_clinic_slug')")).rows;
    const settings = Object.fromEntries(rows.map(row => [row.key, row.value]));
    res.json({
      source: settings.booking_source === 'digitail' ? 'digitail' : 'internal',
      digitail_clinic_slug: settings.digitail_clinic_slug || fallback.digitail_clinic_slug
    });
  } catch (error) {
    console.error('booking-config:', error.message);
    res.json(fallback);
  }
});'''.strip()
          if "/api/booking-config" not in text:
              if health not in text:
                  raise SystemExit('Could not find health route anchor in server/index.js')
              text = text.replace(health, health + "\n" + route, 1)
              server.write_text(text, encoding='utf-8')

          # 2) Load the frontend switch without changing the existing booking form.
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          script = '    <script src="/booking-source.js" defer></script>\n'
          if '/booking-source.js' not in html:
              if '</body>' not in html:
                  raise SystemExit('Could not find </body> in index.html')
              html = html.replace('</body>', script + '</body>', 1)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          rm -f .github/workflows/apply-booking-switch.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server/index.js .github/workflows/apply-booking-switch.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Wire dashboard booking source to website [skip ci]"
          git push origin HEAD:chatgpt/booking-source-switch
