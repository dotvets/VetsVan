name: Apply booking source switch

on:
  push:
    branches:
      - chatgpt/booking-source-switch
    paths:
      - .github/workflows/apply-booking-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/booking-source-switch
          fetch-depth: 0

      - name: Patch booking source integration
        run: python3 tools/apply-booking-switch.py

      - name: Commit integration
        run: |
          rm -f .github/workflows/apply-booking-switch.yml tools/apply-booking-switch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server/index.js .github/workflows/apply-booking-switch.yml tools/apply-booking-switch.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Wire dashboard booking source to website [skip ci]"
          git push origin HEAD:chatgpt/booking-source-switch
