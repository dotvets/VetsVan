name: Fix Arabic language routing
on:
  push:
    paths:
      - '.github/workflows/fix-arabic-language.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python scripts/fix-arabic-language.py
      - name: Verify
        run: |
          set -e
          ! grep -q "localStorage.setItem('vv_language','en')" ar/index.html
          grep -q "localStorage.setItem('vv_language','ar')" ar/index.html
          grep -q '<a href="/" class="lang-btn en-btn">EN</a>' ar/index.html
          grep -q '<a href="/ar/" class="lang-btn ar-btn active">AR</a>' ar/index.html
          grep -q '"url":"https://www.vetsvan.com/ar/"' ar/index.html
          grep -q '"name":"التطعيمات"' ar/index.html
          grep -Fq "app.get(['/ar/book', '/ar/book/']" server/index.js
          node --check server/index.js
          node --check booking-source.js
      - name: Commit
        run: |
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add ar/index.html ar/services/index.html ar/about/index.html ar/contact/index.html server/index.js
          git commit -m "Fix Arabic language routing and metadata"
          git rm .github/workflows/fix-arabic-language.yml scripts/fix-arabic-language.py
          git commit -m "Remove temporary Arabic language fix tooling"
          git push
