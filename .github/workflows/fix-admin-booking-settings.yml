name: Fix admin booking settings asset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-booking-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Serve admin enhancement script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/index.js')
          s = p.read_text(encoding='utf-8')
          anchor = "app.get('/admin/login',(_req,res)=>res.sendFile(path.join(__dirname,'..','admin','login.html')));"
          route = "app.get('/admin/rbac-client.js',(_req,res)=>res.sendFile(path.join(__dirname,'..','admin','rbac-client.js')));"
          if route not in s:
              if anchor not in s:
                  raise SystemExit('admin login route anchor not found')
              s = s.replace(anchor, route + "\n" + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-booking-settings.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js .github/workflows/fix-admin-booking-settings.yml
          git commit -m "Fix admin booking settings asset route [skip ci]"
          git push origin HEAD:main
