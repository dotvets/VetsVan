name: Fix service card links
on:
  push:
    paths:
      - '.github/workflows/fix-service-card-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make service cards fully clickable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1='<div class="editorial-card reveal reveal-delay-1">\n                    <span class="num-editorial">02</span>'
          new1='<div class="editorial-card reveal reveal-delay-1" role="link" tabindex="0" onclick="window.location.href=\'/services/vaccinations/\'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();window.location.href=\'/services/vaccinations/\'}" style="cursor:pointer">\n                    <span class="num-editorial">02</span>'
          if old1 not in s:
              raise SystemExit('vaccination card anchor not found')
          s=s.replace(old1,new1,1)
          old2='<div class="editorial-card reveal reveal-delay-1">\n                    <span class="num-editorial">04</span>'
          new2='<div class="editorial-card reveal reveal-delay-1" role="link" tabindex="0" onclick="window.location.href=\'/services/dental-cleaning/\'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();window.location.href=\'/services/dental-cleaning/\'}" style="cursor:pointer">\n                    <span class="num-editorial">04</span>'
          if old2 not in s:
              raise SystemExit('dental card anchor not found')
          s=s.replace(old2,new2,1)
          # Prevent nested link click from double-handling while keeping normal navigation.
          s=s.replace('href="/services/vaccinations/" class="service-learn-link"','href="/services/vaccinations/" class="service-learn-link" onclick="event.stopPropagation()"',1)
          s=s.replace('href="/services/dental-cleaning/" class="service-learn-link"','href="/services/dental-cleaning/" class="service-learn-link" onclick="event.stopPropagation()"',1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q "window.location.href='/services/vaccinations/'" index.html
          grep -q "window.location.href='/services/dental-cleaning/'" index.html
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-service-card-links.yml
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add index.html .github/workflows/fix-service-card-links.yml
          git commit -m "Fix homepage service card navigation"
          git push
