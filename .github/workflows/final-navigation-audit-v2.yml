name: Run final navigation audit
on:
  push:
    paths:
      - '.github/workflows/final-navigation-audit-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/final_navigation_audit.py
      - run: grep -q "VV_PAGE_TITLES" index.html
      - run: grep -q "vv_language" index.html
      - run: |
          rm .github/workflows/final-navigation-audit.yml
          rm .github/workflows/final-navigation-audit-v2.yml
          rm scripts/final_navigation_audit.py
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add -A
          git commit -m "Harden site navigation and language persistence"
          git push