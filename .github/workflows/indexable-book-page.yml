name: Indexable book page
on:
  push:
    paths:
      - '.github/workflows/indexable-book-page.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/add_indexable_book.py
      - name: Verify booking page safety
        run: |
          grep -q "app.get(\['/book', '/book/'\]" server/index.js
          grep -q "cleanPath === '/book'" booking-source.js
          grep -q "https://www.vetsvan.com/book/" sitemap.xml
          grep -q 'href="/book/"' index.html
          test ! -e book/index.html
          grep -q "applyBookingSource" booking-source.js
          grep -q "digitail_clinic_slug" booking-source.js
      - name: Commit and clean temporary files
        run: |
          rm .github/workflows/indexable-book-page.yml
          rm scripts/add_indexable_book.py
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add -A
          git commit -m "Add indexable booking URL without duplicating booking logic"
          git push
