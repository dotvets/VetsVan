name: Optimize website images
on:
  push:
    paths:
      - '.github/workflows/optimize-images.yml'
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Optimize images
        run: python scripts/optimize-images.py
      - name: Verify referenced WebP files exist
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),Path('about/index.html'),Path('services/index.html'),Path('contact/index.html')]+list(Path('services').glob('*/index.html'))
          refs=set()
          for p in files:
              if not p.exists(): continue
              refs.update(re.findall(r'src="/([^" ]+\.webp)"', p.read_text()))
          if not refs:
              raise SystemExit('No WebP refs found')
          missing=[r for r in refs if not Path(r).exists()]
          if missing:
              raise SystemExit('Missing WebP files: '+', '.join(missing))
          print('Verified', len(refs), 'WebP references')
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add '*.webp' index.html about/index.html services/index.html contact/index.html services/*/index.html
          git commit -m "Optimize website images with WebP"
          git rm .github/workflows/optimize-images.yml scripts/optimize-images.py
          git commit -m "Remove temporary image optimization tooling"
          git push
