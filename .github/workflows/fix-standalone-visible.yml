name: Fix standalone page visibility
on:
  push:
    paths:
      - '.github/workflows/fix-standalone-visible.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix standalone pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['services/index.html','about/index.html','contact/index.html']
          for name in pages:
              p=Path(name)
              s=p.read_text()
              if '<base href="/">' not in s:
                  s=s.replace('<meta name="viewport" content="width=device-width, initial-scale=1.0">','<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<base href="/">',1)
              marker='</style>'
              fix='''\n/* Standalone page: content is visible without SPA/scroll-observer JS */\n.page { display: block !important; }\n.reveal, .img-reveal { opacity: 1 !important; transform: none !important; }\n.hero-stagger-1, .hero-stagger-2, .hero-stagger-3 { opacity: 1 !important; }\n'''
              if 'Standalone page: content is visible' not in s:
                  s=s.replace(marker,fix+marker,1)
              p.write_text(s)
          PY
      - name: Verify visible content and assets
        run: |
          grep -q 'Comprehensive Care' services/index.html
          grep -q 'Wellness Exams' services/index.html
          grep -q 'VETS VAN.' about/index.html
          grep -q 'Our Experts' about/index.html
          grep -q 'Get In Touch' contact/index.html
          grep -q 'Send a Message' contact/index.html
          for f in services/index.html about/index.html contact/index.html; do
            grep -q 'Standalone page: content is visible' "$f"
            grep -q '<base href="/">' "$f"
          done
      - name: Commit fix
        run: |
          rm .github/workflows/fix-standalone-visible.yml
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add -A
          git commit -m "Fix standalone page content visibility"
          git push
