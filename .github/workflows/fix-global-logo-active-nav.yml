name: Fix global logo and active navigation
on:
  push:
    paths:
      - '.github/workflows/fix-global-logo-active-nav.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python scripts/fix-global-logo-active-nav.py
      - name: Verify
        run: |
          set -e
          ! grep -R 'src="Vets_van_logo_png.png' --include='*.html' .
          ! grep -R "src='Vets_van_logo_png.png" --include='*.html' .
          grep -q 'id="vv-active-navigation"' index.html
          grep -q 'id="vv-active-navigation"' services/index.html
          grep -q 'id="vv-active-navigation"' about/index.html
          grep -q 'id="vv-active-navigation"' contact/index.html
          grep -q 'id="vv-active-navigation"' ar/index.html
          grep -q 'id="vv-active-navigation"' ar/services/index.html
          grep -q 'id="vv-active-navigation"' ar/about/index.html
          grep -q 'id="vv-active-navigation"' ar/contact/index.html
          grep -q "link.classList.remove('active-link')" index.html
          grep -q "link.setAttribute('aria-current', 'page')" index.html
      - name: Commit
        run: |
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add '*.html' ar services about contact index.html
          git commit -m "Fix logos and current navigation state across pages"
          git rm .github/workflows/fix-global-logo-active-nav.yml scripts/fix-global-logo-active-nav.py
          git commit -m "Remove temporary navigation fix tooling"
          git push
