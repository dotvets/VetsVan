name: Inline booking settings
'on':
  push:
    paths:
      - '.github/workflows/inline-booking-settings.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin dashboard
        run: python scripts/patch-admin-booking.py
      - name: Verify
        run: |
          grep -q 'data-t="booking-settings"' admin/index.html
          grep -q "if (t === 'booking-settings')" admin/index.html
      - name: Commit
        run: |
          rm .github/workflows/inline-booking-settings.yml scripts/patch-admin-booking.py
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add admin/index.html .github/workflows/inline-booking-settings.yml scripts/patch-admin-booking.py
          git commit -m "Make booking settings native in admin dashboard"
          git push
