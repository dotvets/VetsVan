name: Fix book page logo
on:
  push:
    paths:
      - '.github/workflows/fix-book-logo.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="Vets_van_logo_png.png"'
          new='src="/Vets_van_logo_png.png"'
          if old not in s:
              raise SystemExit('expected relative logo path not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'src="/Vets_van_logo_png.png"' index.html
      - name: Commit
        run: |
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add index.html
          git commit -m "Fix logo path on indexable booking page"
          git rm .github/workflows/fix-book-logo.yml
          git commit -m "Remove temporary logo fix workflow"
          git push
