name: Link standalone pages
on:
  push:
    paths:
      - '.github/workflows/link-real-pages.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation
        run: python scripts/link_real_pages.py
      - name: Verify standalone pages and links
        run: |
          test -f services/index.html
          test -f about/index.html
          test -f contact/index.html
          grep -q 'href="/services/"' index.html
          grep -q 'href="/about/"' index.html
          grep -q 'href="/contact/"' index.html
          grep -q 'https://www.vetsvan.com/services/' sitemap.xml
          grep -q 'https://www.vetsvan.com/about/' sitemap.xml
          grep -q 'https://www.vetsvan.com/contact/' sitemap.xml
      - name: Commit and clean temporary files
        run: |
          rm .github/workflows/link-real-pages.yml
          rm scripts/link_real_pages.py
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add -A
          git commit -m "Use standalone indexable core pages"
          git push