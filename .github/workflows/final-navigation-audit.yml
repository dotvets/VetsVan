name: Final navigation audit
on:
  push:
    paths:
      - '.github/workflows/final-navigation-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden navigation and language persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_switch="""        function switchLang(lang) {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.' + lang + '-btn').forEach(btn => btn.classList.add('active'));
                
                document.body.style.opacity = '1';
                handleScrollAnimations();
            }, 400);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.' + (document.documentElement.lang || 'en') + '-btn').forEach(btn => btn.classList.add('active'));
            initScrollObserver();
        });
"""
          new_switch="""        function applyLanguage(lang, persist = true) {
            const safeLang = lang === 'ar' ? 'ar' : 'en';
            document.documentElement.lang = safeLang;
            document.documentElement.dir = safeLang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.' + safeLang + '-btn').forEach(btn => btn.classList.add('active'));
            if (persist) {
                try { localStorage.setItem('vv_language', safeLang); } catch (_) {}
            }
        }

        function switchLang(lang) {
            document.body.style.opacity = '0';
            setTimeout(() => {
                applyLanguage(lang, true);
                document.body.style.opacity = '1';
                handleScrollAnimations();
            }, 400);
        }

        document.addEventListener('DOMContentLoaded', () => {
            let savedLang = null;
            try { savedLang = localStorage.getItem('vv_language'); } catch (_) {}
            applyLanguage(savedLang === 'ar' ? 'ar' : 'en', false);
            initScrollObserver();

            const initialPage = location.hash.replace('#', '');
            if (['book', 'services', 'about', 'contact'].includes(initialPage)) {
                navTo(initialPage, false);
            }
        });
"""
          if old_switch not in s:
              raise SystemExit('language block not found')
          s=s.replace(old_switch,new_switch,1)

          old_nav="""        // Navigation Logic (Smooth Transition)
        function navTo(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            setTimeout(() => {
                document.getElementById(pageId).classList.add('active');
                handleScrollAnimations(); 
            }, 10);
            
            document.querySelectorAll('.nav-links > a').forEach(link => link.classList.remove('active-link'));
            if(event && event.currentTarget.classList.contains('active-link') === false) {
                if(!event.currentTarget.classList.contains('lang-btn')){
                     event.currentTarget.classList.add('active-link');
                }
            }

            const navLinks = document.getElementById('navLinks');
            if (navLinks.classList.contains('show')) {
                navLinks.classList.remove('show');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
"""
          new_nav="""        // Navigation Logic (Smooth Transition + stable browser history)
        const VV_PAGE_TITLES = {
            home: 'Mobile Veterinary Clinic in Riyadh | VETS VAN',
            services: 'Mobile Veterinary Services in Riyadh | VETS VAN',
            about: 'About VETS VAN | Mobile Veterinary Care in Riyadh',
            contact: 'Contact VETS VAN | Mobile Vet Riyadh',
            book: 'Book a Mobile Vet Visit in Riyadh | VETS VAN',
            'booking-success': 'Booking Confirmed | VETS VAN'
        };

        function navTo(pageId, updateHistory = true) {
            const targetPage = document.getElementById(pageId);
            if (!targetPage || !targetPage.classList.contains('page')) return false;

            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            targetPage.classList.add('active');
            handleScrollAnimations();

            document.querySelectorAll('.nav-links > a').forEach(link => {
                const action = link.getAttribute('onclick') || '';
                link.classList.toggle('active-link', action.includes(`navTo('${pageId}')`));
            });

            const navLinks = document.getElementById('navLinks');
            if (navLinks && navLinks.classList.contains('show')) navLinks.classList.remove('show');

            if (VV_PAGE_TITLES[pageId]) document.title = VV_PAGE_TITLES[pageId];

            if (updateHistory) {
                const nextUrl = pageId === 'home' ? location.pathname : `#${pageId}`;
                const currentRoute = location.hash.replace('#', '') || 'home';
                if (currentRoute !== pageId) history.pushState({ pageId }, '', nextUrl);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            return false;
        }

        // Prevent placeholder href="#" links from overwriting SPA history after navTo runs.
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a[href="#"]');
            if (link && (link.getAttribute('onclick') || '').includes('navTo(')) e.preventDefault();
        });

        window.addEventListener('popstate', () => {
            const route = location.hash.replace('#', '');
            navTo(['book', 'services', 'about', 'contact'].includes(route) ? route : 'home', false);
        });
"""
          if old_nav not in s:
              raise SystemExit('navigation block not found')
          s=s.replace(old_nav,new_nav,1)
          p.write_text(s)
          PY
      - name: Verify changes
        run: |
          grep -q "VV_PAGE_TITLES" index.html
          grep -q "window.addEventListener('popstate'" index.html
          grep -q "localStorage.setItem('vv_language'" index.html
          ! grep -q "if(event && event.currentTarget" index.html
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/final-navigation-audit.yml
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add index.html .github/workflows/final-navigation-audit.yml
          git commit -m "Harden site navigation and language persistence"
          git push