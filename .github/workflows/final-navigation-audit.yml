name: Final navigation audit
on:
  push:
    paths:
      - '.github/workflows/final-navigation-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply navigation patch
        run: python scripts/final_navigation_audit.py
      - name: Verify changes
        run: |
          grep -q "VV_PAGE_TITLES" index.html
          grep -q "window.addEventListener('popstate'" index.html
          grep -q "localStorage.setItem('vv_language'" index.html
          if grep -q "if(event && event.currentTarget" index.html; then exit 1; fi
      - name: Commit changes and remove temporary files
        run: |
          rm .github/workflows/final-navigation-audit.yml
          rm scripts/final_navigation_audit.py
          git config user.name "Mohamed-Omaar"
          git config user.email "mohamed.mostafa.omaar@gmail.com"
          git add index.html .github/workflows/final-navigation-audit.yml scripts/final_navigation_audit.py
          git commit -m "Harden site navigation and language persistence"
          git push